name: Lint PHP

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Validar sintaxis
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
